[package]
name = "mychess"
version = "0.1.0"
edition = "2024"

[lib]
name = "mychess"
path = "src/lib.rs"

[[bin]]
name = "mychess"
path = "src/main.rs"

[dependencies]
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
microbench = "0.5.0"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "slider"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
debug = true

# Release with debug asserts enabled (used by --detailed / debugging runs)
[profile.release-asserts]
inherits = "release"
debug-assertions = true
overflow-checks = true
